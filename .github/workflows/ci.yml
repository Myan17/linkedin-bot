name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # playwright 1.43 pins a greenlet that does not build on 3.14.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        # No browser download: every test stubs the Playwright page, and the
        # bot is never run against LinkedIn from CI.
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Test
        run: pytest tests -q --cov=bot --cov-report=term-missing --cov-fail-under=65

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
